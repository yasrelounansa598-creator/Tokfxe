<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF" />
      <stop offset="50%" stop-color="#8A2BFF" />
      <stop offset="100%" stop-color="#FF00A8" />
    </linearGradient>
  </defs>

  <!-- Deep luxury dark squircle -->
  <rect width="128" height="128" rx="28" fill="#05070B" />
  <rect width="120" height="120" x="4" y="4" rx="24" fill="none" stroke="url(#favGrad)" stroke-width="2.5" stroke-opacity="0.8" />

  <!-- Tok Fxe Monogram Mark -->
  <g transform="translate(18, 16) scale(0.92)">
    <!-- Vertical F stem -->
    <rect x="14" y="14" width="16" height="68" rx="4" fill="#00D9FF" />
    <!-- Top F bar -->
    <rect x="30" y="14" width="30" height="14" rx="3" fill="#00D9FF" />
    <!-- Middle crossbar -->
    <rect x="30" y="38" width="22" height="12" rx="3" fill="#8A2BFF" />
    <!-- Sweeping X Leg -->
    <polygon points="26,82 46,52 68,82 56,82 43,62 38,70 38,82" fill="#FF00A8" />
    <!-- Play Triangle Core -->
    <polygon points="46,30 46,66 76,48" fill="#FF00A8" />
    <polygon points="50,38 50,58 66,48" fill="#FFFFFF" />
  </g>
</svg>
